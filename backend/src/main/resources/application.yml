# Settings shared by every environment. Database credentials live in the dev and prod profiles,
# so starting without a profile fails fast instead of connecting to an unintended database.
spring:
  application:
    name: docchat-backend
  datasource:
    hikari:
      # Fail quickly when the database is down, so status and readiness checks do not hang.
      connection-timeout: 5000
  jdbc:
    template:
      query-timeout: 5s
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    clients:
      connect-timeout: 3s
      # Answering can take a while, mostly when the model has to be loaded first.
      read-timeout: 170s
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # Compose downloads the models, so the backend never waits for a download.
        pull-model-strategy: never
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen3.5:9b}
        num-ctx: 8192
        temperature: 0.1
        think: false
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 5s
  servlet:
    multipart:
      # Keep in sync with client_max_body_size in frontend/nginx.conf and MAX_FILE_SIZE_BYTES in
      # the frontend's document model. The request limit leaves room for the multipart overhead.
      max-file-size: 25MB
      max-request-size: 26MB
  session:
    jdbc:
      # The tables are created by a Flyway migration.
      initialize-schema: never

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  tomcat:
    # Reads an oversized upload to its end, so the client receives the 413 instead of a reset.
    max-swallow-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,pgvector,storage

springdoc:
  show-login-endpoint: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

docchat:
  storage:
    # A relative path is resolved against the working directory.
    directory: ${DOCCHAT_STORAGE_DIR:storage}
  documents:
    # Room for 200 files of the largest size accepted.
    storage-per-user: 5GB
  ingestion:
    workers: 2
    queue-capacity: 100
    max-pages: 2000
    # Far above what was measured on an RTX 3060: 110 seconds for 500 pages.
    max-processing-time: 30m
    # How often to look for documents left without a worker, such as during a database outage.
    resume-interval: PT1M
  rag:
    # How many passages the model reads, and how similar to the question they must be.
    top-k: 6
    # Measured with bge-m3: related questions scored 0.66 or more, and unrelated ones about 0.26.
    min-similarity: 0.35
    # The GPU works on one at a time, so this only limits how many can be waiting for it.
    max-concurrent-questions: 4
    # Keep below proxy_read_timeout in frontend/nginx.conf.
    question-time-limit: 170s
