# Settings shared by every environment. Database credentials live in the dev and prod profiles,
# so starting without a profile fails fast instead of connecting to an unintended database.
spring:
  application:
    name: docchat-backend
  datasource:
    hikari:
      # Fail quickly when the database is down, so status and readiness checks do not hang.
      connection-timeout: 5000
  jdbc:
    template:
      query-timeout: 5s
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,pgvector

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
