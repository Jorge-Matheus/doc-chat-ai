server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Keep in sync with spring.servlet.multipart.max-request-size in the backend.
    client_max_body_size 26m;

    # Docker's embedded DNS server.
    resolver 127.0.0.11 valid=10s;

    # The browser only talks to this server, so the API is same-origin and needs no CORS.
    location ~ ^/(api|v3/api-docs|swagger-ui)(/|$) {
        # With a variable, nginx resolves the name at request time instead of only at startup,
        # so it keeps working when the backend container is recreated with a new address.
        set $backend http://backend:8080;
        proxy_pass $backend;
        # Report an unavailable backend quickly instead of waiting for the 60-second default.
        proxy_connect_timeout 5s;
        # Answering runs a model on this computer. Slightly longer than the backend's own limit.
        proxy_read_timeout 180s;
        # Spring Security sends these too, and the add_header lines above would repeat them.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes must fall back to the application shell.
    location / {
        # An add_header here replaces those of the server block, so they have to be repeated.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # If a document's text ever reached the page as markup, its scripts still could not run.
        # Angular and Angular Material add styles at runtime, which needs 'unsafe-inline' for styles.
        # It also needs inlineCritical off in angular.json, or the stylesheet would not load.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ /index.html;
    }
}
