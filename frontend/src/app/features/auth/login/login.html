<h1>Sign in</h1>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="username" />
    <mat-error>Enter a valid email.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" autocomplete="current-password" />
    <mat-error>Enter your password.</mat-error>
  </mat-form-field>

  @if (error(); as message) {
    <p class="form-error" role="alert" data-testid="form-error">{{ message }}</p>
  }

  <button matButton="filled" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Signing in...' : 'Sign in' }}
  </button>
</form>

<p class="alternative">New here? <a routerLink="/register">Create an account</a></p>
