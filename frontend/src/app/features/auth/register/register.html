<h1>Create your account</h1>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <mat-form-field appearance="outline">
    <mat-label>Email</mat-label>
    <input matInput type="email" formControlName="email" autocomplete="username" />
    <mat-error>Enter a valid email.</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Password</mat-label>
    <input matInput type="password" formControlName="password" autocomplete="new-password" />
    <mat-hint>At least {{ minPasswordLength }} characters.</mat-hint>
    <mat-error>Use at least {{ minPasswordLength }} characters.</mat-error>
  </mat-form-field>

  @if (error(); as message) {
    <p class="form-error" role="alert" data-testid="form-error">{{ message }}</p>
  }

  <button matButton="filled" type="submit" [disabled]="submitting()">
    {{ submitting() ? 'Creating account...' : 'Create account' }}
  </button>
</form>

<p class="alternative">Already registered? <a routerLink="/login">Sign in</a></p>
