<header>
  <mat-toolbar class="app-header">
    <a class="brand" routerLink="/">DocChat AI</a>
    <span class="spacer"></span>
    @if (auth.user(); as user) {
      <a matButton routerLink="/documents">Documents</a>
      <span class="user-email" data-testid="user-email">{{ user.email }}</span>
      <button matButton type="button" (click)="signOut()">Sign out</button>
    } @else {
      <a matButton routerLink="/login">Sign in</a>
      <a matButton="filled" routerLink="/register">Create account</a>
    }
  </mat-toolbar>
</header>
<main class="app-main">
  @if (signOutFailed()) {
    <p class="sign-out-error" role="alert">Could not sign out. Try again in a moment.</p>
  }
  <router-outlet />
</main>
